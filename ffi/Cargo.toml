[package]
name = "grafile-ffi"
version = "0.1.0"
edition = "2024"
description = "C ABI for grafile, the single-file graph database"
license = "Apache-2.0"

[lib]
name = "grafile"
crate-type = ["cdylib", "staticlib"]

[dependencies]
grafile = { path = ".." }
serde_json = "1.0"

[dev-dependencies]
tempfile = "3"
