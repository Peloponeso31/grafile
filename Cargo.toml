[package]
name = "grafile"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
crc32c = "0.6.8"
fs4 = "1.1.0"
hashbrown = "0.17.1"
hashlink = "0.12.2"
indicatif = "0.18.6"
itoa = "1.0.18"
logos = "0.16.1"
regex = "1.13.1"
rustyline = "18.0.1"
ryu = "1.0.23"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
smallvec = "1.16.3"
thiserror = "2.0.21"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
unicode-width = "0.2.2"
uuid = { version = "1.28.0", features = ["v4"] }

[dev-dependencies]
criterion = "0.8.2"
proptest = "1.12.0"
tempfile = "3.27.0"

[[bench]]
name = "storage"
harness = false

[[bench]]
name = "queries"
harness = false
