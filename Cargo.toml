[package]
name = "grafile"
version = "0.1.0"
edition = "2024"
description = "Single-file graph database with a Cypher shell"
license = "MIT"
repository = "https://github.com/Peloponeso31/grafile"

[dependencies]
anyhow = "1.0.104"
crc32c = "0.6.8"
csv = "1.3"
fastrand = "2.3.0"
fs4 = "1.1.0"
hashbrown = "0.17.1"
hashlink = "0.12.2"
indicatif = "0.18.6"
itoa = "1.0.18"
jiff = { version = "0.2", default-features = false, features = ["std", "tzdb-bundle-always", "tzdb-concatenated"] }
libc = "0.2.190"
logos = "0.16.1"
regex = "1.13.1"
rustyline = "18.0.1"
ryu = "1.0.23"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
smallvec = "1.16.3"
thiserror = "2.0.21"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
unicode-width = "0.2.2"
uuid = { version = "1.28.0", features = ["v4"] }

[dev-dependencies]
criterion = "0.8.2"
proptest = "1.12.0"
rusqlite = { version = "0.40.2", features = ["bundled"] }
tempfile = "3.27.0"

[package.metadata.deb]
maintainer = "Tanil Izquierdo <Peloponeso31@users.noreply.github.com>"
license-file = ["LICENSE", "0"]
section = "database"
priority = "optional"
extended-description = """\
grafile is a single-file graph database with an interactive Cypher shell. \
It stores nodes, relationships, labels and indexes in one portable file, \
supports transactions and crash recovery, and ships a REPL plus script \
runner for querying databases from the command line."""
assets = [
    ["target/release/grafile", "usr/bin/", "755"],
    ["README.md", "usr/share/doc/grafile/README.md", "644"],
]

[package.metadata.generate-rpm]
assets = [
    { source = "target/release/grafile", dest = "/usr/bin/grafile", mode = "755" },
    { source = "README.md", dest = "/usr/share/doc/grafile/README.md", mode = "644", doc = true },
    { source = "LICENSE", dest = "/usr/share/licenses/grafile/LICENSE", mode = "644" },
]

[[bench]]
name = "storage"
harness = false

[[bench]]
name = "queries"
harness = false

[workspace]
members = ["ffi", "tck-runner"]

[[bench]]
name = "insert"
harness = false
